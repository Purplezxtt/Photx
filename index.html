<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photx</title>
<meta name="theme-color" content="#0e4a40">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Photx">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap">
<style>
/* Layout: cabeçalho fixo com busca e filtros, grade densa agrupada por dia, visualizador em tela cheia. */
:root {
  color-scheme: light;
  --bg: #f5f6f8;
  --surface: #ffffff;
  --tile: #e4e8ed;
  --fg: #14181d;
  --muted: #5a6572;
  --line: #d9dee5;
  --accent: #0b7a64;
  --accent-fg: #ffffff;
  --accent-soft: #d8efe9;
  --danger: #b73333;
  --viewer-bg: #0b0d0f;
  --viewer-fg: #eef1f4;
  --font-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101316; --surface: #181c21; --tile: #20262c; --fg: #e9edf0; --muted: #9aa5b1;
    --line: #2a3139; --accent: #4cc6a6; --accent-fg: #07241d; --accent-soft: #17332d; --danger: #ff8077;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 96px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
img { max-width: 100%; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); padding-block: 12px 8px; border-bottom: 1px solid var(--line); margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px))); padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
.top, .selbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-height: 44px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.35rem; letter-spacing: -0.01em; margin-right: auto; }
.brand small { display: block; font-family: var(--font-body); font-weight: 400; font-size: 0.78rem; color: var(--muted); letter-spacing: 0; }
.search { flex: 1 1 180px; min-width: 0; max-width: 360px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 14px; font-weight: 600; min-height: 40px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.danger { color: var(--danger); }
.btn.danger.armed { background: var(--danger); color: var(--bg); border-color: var(--danger); }
.selbar .count { font-family: var(--font-display); font-weight: 700; margin-right: auto; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-top: 8px; scrollbar-width: none; }
.chip { flex: none; border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 6px 14px; color: var(--muted); font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--fg); font-weight: 600; }

main { padding-top: 8px; }
.day { margin-top: 22px; }
.day h2 { font-family: var(--font-display); font-size: 1rem; font-weight: 600; margin: 0 0 8px; display: flex; gap: 8px; align-items: baseline; }
.day h2 span { color: var(--muted); font-family: var(--font-body); font-weight: 400; font-size: 0.82rem; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 3px; }
.cell { position: relative; aspect-ratio: 1; overflow: hidden; background: var(--tile); border: 0; padding: 0; border-radius: 3px; display: block; width: 100%; min-width: 0; }
.cell img, .cell video { width: 100%; height: 100%; object-fit: cover; display: block; max-width: none; }
.cell[aria-selected="true"] { outline: 3px solid var(--accent); outline-offset: -3px; }
.cell[aria-selected="true"] img, .cell[aria-selected="true"] video { transform: scale(0.9); }
.play { position: absolute; left: 6px; bottom: 6px; background: rgba(0,0,0,.62); color: #fff; font-size: 0.72rem; border-radius: 4px; padding: 1px 6px; }
.starred { position: absolute; right: 6px; bottom: 4px; color: #ffd24a; text-shadow: 0 1px 3px rgba(0,0,0,.7); font-size: 1rem; }
.check { position: absolute; left: 6px; top: 6px; width: 24px; height: 24px; border-radius: 50%; border: 2px solid #fff; background: rgba(0,0,0,.35); opacity: 0; display: grid; place-items: center; color: #fff; font-size: 0.8rem; font-weight: 700; }
.cell:hover .check, .cell:focus-visible .check, body.selecting .check { opacity: 1; }
@media (hover: none) { .check { opacity: .85; } }
.cell[aria-selected="true"] .check { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); opacity: 1; }
.filetile { height: 100%; padding: 10px; display: flex; flex-direction: column; justify-content: space-between; text-align: left; background: var(--surface); }
.ext { font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; color: var(--accent); letter-spacing: 0.04em; }
.fname { font-size: 0.74rem; color: var(--muted); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; word-break: break-word; }

.empty { margin: 56px auto 0; max-width: 420px; text-align: center; display: grid; gap: 10px; justify-items: center; }
.empty h2 { font-family: var(--font-display); font-size: 1.3rem; margin: 0; text-wrap: balance; }
.empty p { margin: 0; color: var(--muted); text-wrap: balance; }
.meter { margin-top: 36px; color: var(--muted); font-size: 0.82rem; display: grid; gap: 6px; max-width: 360px; }
.meter .bar { height: 5px; border-radius: 3px; background: var(--tile); overflow: hidden; }
.meter .bar i { display: block; height: 100%; background: var(--accent); }

#status { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; justify-content: center; pointer-events: none; }
#status .msg { pointer-events: auto; background: var(--fg); color: var(--bg); border-radius: 10px; padding: 10px 14px; max-width: 560px; display: flex; gap: 12px; align-items: flex-start; box-shadow: 0 6px 24px rgba(0,0,0,.25); }
#status ul { margin: 4px 0 0; padding-left: 18px; font-size: 0.85rem; }
#status button { background: transparent; border: 0; color: inherit; text-decoration: underline; padding: 0; flex: none; }

#drop { position: fixed; inset: 0; z-index: 45; background: color-mix(in srgb, var(--bg) 88%, transparent); display: grid; place-items: center; font-family: var(--font-display); font-size: 1.4rem; font-weight: 700; border: 3px dashed var(--accent); margin: 10px; border-radius: 12px; pointer-events: none; }

#viewer { position: fixed; inset: 0; z-index: 50; background: var(--viewer-bg); color: var(--viewer-fg); display: grid; grid-template-rows: auto 1fr auto; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
.vbar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; flex-wrap: wrap; }
.vtitle { flex: 1 1 140px; min-width: 0; font-family: var(--font-display); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vbar .btn { background: transparent; color: var(--viewer-fg); border-color: rgba(255,255,255,.28); padding: 7px 12px; min-height: 36px; text-decoration: none; display: inline-flex; align-items: center; }
.vbar .btn.danger { color: #ff9a92; }
.vbar .btn.danger.armed { background: #ff8077; color: #1a0a08; }
.vstage { min-height: 0; display: grid; place-items: center; padding: 0 56px; position: relative; }
.vstage img, .vstage video { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
.vstage .filecard { background: #1a1e23; border: 1px solid rgba(255,255,255,.18); border-radius: 12px; padding: 28px; text-align: center; display: grid; gap: 10px; justify-items: center; max-width: 340px; }
.vstage .filecard .ext { font-size: 2.2rem; color: #4cc6a6; }
.vnav { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 64px; border: 0; background: transparent; color: var(--viewer-fg); font-size: 2rem; }
.vnav.prev { left: 4px; } .vnav.next { right: 4px; }
.vnav:disabled { opacity: .25; cursor: default; }
.vmeta { padding: 10px 16px 14px; font-size: 0.82rem; color: #aab3bd; text-align: center; }

@media (prefers-reduced-motion: no-preference) { .cell img, .cell video { transition: transform .15s; } }
@media (max-width: 480px) { .vstage { padding: 0 8px; } .vnav { background: rgba(0,0,0,.4); border-radius: 8px; height: 48px; width: 36px; } }
</style>
</head>
<body>

<header>
  <div class="top" id="top">
    <div class="brand">Photx<small id="subtitle">Carregando…</small></div>
    <input class="search" id="q" type="search" placeholder="Buscar pelo nome" aria-label="Buscar pelo nome">
    <button class="btn primary" id="uploadBtn" type="button">Enviar</button>
    <input id="file" type="file" multiple hidden accept="image/*,video/*,application/pdf,text/*,application/json,.md,.csv,.txt,.json">
  </div>
  <div class="selbar" id="selbar" hidden>
    <div class="count" id="selcount"></div>
    <button class="btn" id="selfav" type="button">Favoritar</button>
    <button class="btn danger" id="seldel" type="button">Excluir</button>
    <button class="btn" id="selcancel" type="button">Cancelar</button>
  </div>
  <div class="chips" id="chips" role="group" aria-label="Filtros">
    <button class="chip" type="button" data-f="all" aria-pressed="true">Tudo</button>
    <button class="chip" type="button" data-f="image" aria-pressed="false">Fotos</button>
    <button class="chip" type="button" data-f="video" aria-pressed="false">Vídeos</button>
    <button class="chip" type="button" data-f="file" aria-pressed="false">Arquivos</button>
    <button class="chip" type="button" data-f="fav" aria-pressed="false">Favoritos</button>
  </div>
</header>

<main id="main"><div class="empty"><h2>Carregando sua galeria</h2><p>Buscando os arquivos guardados.</p></div></main>
<div class="meter" id="meter" hidden></div>

<div id="status" hidden></div>
<div id="drop" hidden>Solte para enviar</div>

<div id="viewer" hidden role="dialog" aria-modal="true" aria-label="Visualizador">
  <div class="vbar">
    <button class="btn" id="vclose" type="button">Fechar</button>
    <div class="vtitle" id="vtitle"></div>
    <button class="btn" id="vfav" type="button">Favoritar</button>
    <a class="btn" id="vopen">Baixar</a>
    <button class="btn danger" id="vdel" type="button">Excluir</button>
  </div>
  <div class="vstage" id="vstage">
    <button class="vnav prev" id="vprev" type="button" aria-label="Anterior">‹</button>
    <button class="vnav next" id="vnext" type="button" aria-label="Próximo">›</button>
  </div>
  <div class="vmeta" id="vmeta"></div>
</div>

<script>
/* Photx guarda tudo no IndexedDB do navegador: nada é enviado para servidor nenhum. */
(function () {
  var MAX_BYTES = 200 * 1024 * 1024;
  var TYPES = {
    png: ["image/png", "image"], jpg: ["image/jpeg", "image"], jpeg: ["image/jpeg", "image"], gif: ["image/gif", "image"],
    webp: ["image/webp", "image"], svg: ["image/svg+xml", "image"], avif: ["image/avif", "image"], heic: ["image/heic", "file"],
    bmp: ["image/bmp", "image"], mp4: ["video/mp4", "video"], webm: ["video/webm", "video"], mov: ["video/quicktime", "video"],
    m4v: ["video/mp4", "video"], pdf: ["application/pdf", "file"]
  };
  var idb = null;
  var items = [], loaded = false, filter = "all", query = "", selected = new Set(), openId = null, flat = [];
  var armTimer = null, armedBtn = null;
  var $ = function (s) { return document.querySelector(s); };

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function fmtBytes(n) {
    if (n < 1024) return n + " B";
    if (n < 1048576) return (n / 1024).toLocaleString("pt-BR", { maximumFractionDigits: 0 }) + " KB";
    if (n < 1073741824) return (n / 1048576).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " MB";
    return (n / 1073741824).toLocaleString("pt-BR", { maximumFractionDigits: 2 }) + " GB";
  }
  function extOf(name) { var m = /\.([a-z0-9]+)$/i.exec(name || ""); return m ? m[1].toLowerCase() : ""; }
  function when(it) { return it.takenAt || it.addedAt || 0; }
  var dayFmt = new Intl.DateTimeFormat("pt-BR", { day: "numeric", month: "long", year: "numeric" });
  var timeFmt = new Intl.DateTimeFormat("pt-BR", { dateStyle: "medium", timeStyle: "short" });
  function dayLabel(ts) {
    var d = new Date(ts), t = new Date(), y = new Date(); y.setDate(t.getDate() - 1);
    if (d.toDateString() === t.toDateString()) return "Hoje";
    if (d.toDateString() === y.toDateString()) return "Ontem";
    return dayFmt.format(d);
  }
  function srcOf(it) { if (!it._url) it._url = URL.createObjectURL(it.blob); return it._url; }
  function newId() { return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }

  /* ---------- IndexedDB ---------- */
  function openDB() {
    return new Promise(function (res, rej) {
      var r = indexedDB.open("photx", 1);
      r.onupgradeneeded = function () { r.result.createObjectStore("items", { keyPath: "id" }); };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });
  }
  function tx(mode, fn) {
    return new Promise(function (res, rej) {
      var t = idb.transaction("items", mode), out = fn(t.objectStore("items"));
      t.oncomplete = function () { res(out && out.result); };
      t.onerror = t.onabort = function () { rej(t.error); };
    });
  }
  function saveRecord(it) { var rec = Object.assign({}, it); delete rec._url; return tx("readwrite", function (s) { return s.put(rec); }); }

  /* ---------- status ---------- */
  function setStatus(text, errors) {
    var el = $("#status");
    if (!text && !(errors && errors.length)) { el.hidden = true; el.innerHTML = ""; return; }
    var html = "<div class='msg'><div>" + (text ? esc(text) : "");
    if (errors && errors.length) html += "<ul>" + errors.map(function (e) { return "<li>" + esc(e) + "</li>"; }).join("") + "</ul>";
    html += "</div>";
    if (!text || (errors && errors.length)) html += "<button type='button' id='statusClose'>Fechar</button>";
    html += "</div>";
    el.innerHTML = html; el.hidden = false;
    var c = $("#statusClose"); if (c) c.onclick = function () { setStatus(""); };
  }

  /* ---------- render ---------- */
  function visibleItems() {
    var q = query.trim().toLowerCase();
    return items.filter(function (it) {
      if (filter === "fav" && !it.fav) return false;
      if ((filter === "image" || filter === "video" || filter === "file") && it.kind !== filter) return false;
      if (q && String(it.name || "").toLowerCase().indexOf(q) === -1) return false;
      return true;
    }).sort(function (a, b) { return when(b) - when(a); });
  }

  function render() {
    var main = $("#main");
    flat = visibleItems();
    var total = items.length;
    $("#subtitle").textContent = !loaded ? "Carregando…" : total === 0 ? "Nenhum item" : total + (total === 1 ? " item" : " itens");
    document.body.classList.toggle("selecting", selected.size > 0);
    $("#top").hidden = selected.size > 0; $("#selbar").hidden = selected.size === 0;
    $("#selcount").textContent = selected.size + (selected.size === 1 ? " selecionado" : " selecionados");
    if (!loaded) return;
    if (total === 0) {
      main.innerHTML = "<div class='empty'><h2>Sua galeria está vazia</h2><p>Arraste fotos e vídeos para esta página, cole uma imagem ou toque em Enviar.</p><button class='btn primary' type='button' id='emptyUpload'>Enviar arquivos</button></div>";
      $("#emptyUpload").onclick = function () { $("#file").click(); };
      return;
    }
    if (flat.length === 0) { main.innerHTML = "<div class='empty'><h2>Nada encontrado</h2><p>Troque o filtro ou a busca para ver outros itens.</p></div>"; return; }
    var groups = [], last = null;
    flat.forEach(function (it) {
      var key = new Date(when(it)).toDateString();
      if (!last || last.key !== key) { last = { key: key, ts: when(it), items: [] }; groups.push(last); }
      last.items.push(it);
    });
    main.innerHTML = groups.map(function (g) {
      return "<section class='day'><h2>" + esc(dayLabel(g.ts)) + "<span>" + g.items.length + (g.items.length === 1 ? " item" : " itens") + "</span></h2><div class='grid'>" +
        g.items.map(cellHtml).join("") + "</div></section>";
    }).join("");
    if (openId) { if (!byId(openId)) closeViewer(); else showViewer(); }
  }

  function cellHtml(it) {
    var src = srcOf(it), sel = selected.has(it.id), inner;
    if (it.kind === "image") inner = "<img src='" + src + "' alt='" + esc(it.name) + "' loading='lazy' decoding='async'>";
    else if (it.kind === "video") inner = "<video src='" + src + "#t=0.1' preload='metadata' muted playsinline></video><span class='play'>▶ Vídeo</span>";
    else inner = "<div class='filetile'><div class='ext'>" + esc((extOf(it.name) || "arq").toUpperCase()) + "</div><div class='fname'>" + esc(it.name) + "</div></div>";
    return "<button type='button' class='cell' data-id='" + esc(it.id) + "' aria-selected='" + sel + "' aria-label='" + esc(it.name) + "'>" + inner +
      "<span class='check' data-check='1'>" + (sel ? "✓" : "") + "</span>" + (it.fav ? "<span class='starred'>★</span>" : "") + "</button>";
  }

  /* ---------- selection ---------- */
  function byId(id) { for (var i = 0; i < items.length; i++) if (items[i].id === id) return items[i]; return null; }
  function toggleSel(id) { if (selected.has(id)) selected.delete(id); else selected.add(id); disarm(); render(); }
  $("#main").addEventListener("click", function (e) {
    var cell = e.target.closest(".cell"); if (!cell) return;
    var id = cell.getAttribute("data-id");
    if (e.target.closest("[data-check]") || selected.size > 0) { toggleSel(id); return; }
    openId = id; showViewer();
  });
  $("#selcancel").onclick = function () { selected.clear(); disarm(); render(); };
  $("#selfav").onclick = async function () {
    var ids = Array.from(selected), mk = ids.some(function (id) { var it = byId(id); return it && !it.fav; });
    try { for (var i = 0; i < ids.length; i++) { var it = byId(ids[i]); if (it) { it.fav = mk; await saveRecord(it); } } }
    catch (e) { setStatus("", ["Não foi possível atualizar os favoritos."]); }
    selected.clear(); render();
  };
  $("#seldel").onclick = function () { arm(this, async function () { var ids = Array.from(selected); selected.clear(); await deleteItems(ids); render(); }); };

  function arm(btn, fn) {
    if (armedBtn === btn) { disarm(); fn(); return; }
    disarm(); armedBtn = btn; btn.dataset.label = btn.textContent; btn.textContent = "Confirmar exclusão"; btn.classList.add("armed");
    armTimer = setTimeout(disarm, 4000);
  }
  function disarm() {
    clearTimeout(armTimer);
    if (armedBtn) { armedBtn.textContent = armedBtn.dataset.label || "Excluir"; armedBtn.classList.remove("armed"); armedBtn = null; }
  }

  async function deleteItems(ids) {
    var failed = 0;
    for (var i = 0; i < ids.length; i++) {
      var it = byId(ids[i]); if (!it) continue;
      try { await tx("readwrite", function (s) { return s.delete(it.id); }); } catch (e) { failed++; continue; }
      if (it._url) URL.revokeObjectURL(it._url);
      items = items.filter(function (x) { return x.id !== it.id; });
    }
    if (failed) setStatus("", ["Não foi possível excluir " + failed + (failed === 1 ? " item." : " itens.")]);
    refreshUsage();
  }

  /* ---------- viewer ---------- */
  function showViewer() {
    var idx = -1; for (var i = 0; i < flat.length; i++) if (flat[i].id === openId) { idx = i; break; }
    if (idx < 0) { var cur = byId(openId); if (!cur) { closeViewer(); return; } flat = flat.concat([cur]); idx = flat.length - 1; }
    var it = flat[idx], src = srcOf(it), stage = $("#vstage");
    $("#viewer").hidden = false; document.body.style.overflow = "hidden";
    Array.from(stage.querySelectorAll(".media")).forEach(function (n) { n.remove(); });
    var node = document.createElement("div"); node.className = "media"; node.style.cssText = "max-width:100%;max-height:100%;display:grid;place-items:center;min-height:0;";
    if (it.kind === "image") node.innerHTML = "<img src='" + src + "' alt='" + esc(it.name) + "'>";
    else if (it.kind === "video") node.innerHTML = "<video src='" + src + "' controls playsinline></video>";
    else node.innerHTML = "<div class='filecard'><div class='ext'>" + esc((extOf(it.name) || "arq").toUpperCase()) + "</div><div>" + esc(it.name) + "</div><a class='btn' target='_blank' rel='noopener' href='" + src + "'>Abrir arquivo</a></div>";
    stage.insertBefore(node, stage.firstChild);
    $("#vtitle").textContent = it.name || "";
    $("#vfav").textContent = it.fav ? "★ Favorito" : "☆ Favoritar";
    $("#vopen").setAttribute("href", src);
    $("#vopen").setAttribute("download", it.name || "arquivo");
    $("#vmeta").textContent = fmtBytes(it.size || 0) + " · " + timeFmt.format(new Date(when(it))) + " · " + (idx + 1) + " de " + flat.length;
    $("#vprev").disabled = idx === 0; $("#vnext").disabled = idx === flat.length - 1;
  }
  function closeViewer() {
    openId = null; $("#viewer").hidden = true; document.body.style.overflow = ""; disarm();
    var vid = $("#vstage video"); if (vid) vid.pause();
    Array.from($("#vstage").querySelectorAll(".media")).forEach(function (n) { n.remove(); });
  }
  function step(d) {
    var idx = -1; for (var i = 0; i < flat.length; i++) if (flat[i].id === openId) { idx = i; break; }
    var n = flat[idx + d]; if (n) { openId = n.id; disarm(); showViewer(); }
  }
  $("#vclose").onclick = closeViewer;
  $("#vprev").onclick = function () { step(-1); };
  $("#vnext").onclick = function () { step(1); };
  $("#vfav").onclick = async function () {
    var it = byId(openId); if (!it) return;
    try { it.fav = !it.fav; await saveRecord(it); } catch (e) { it.fav = !it.fav; setStatus("", ["Não foi possível atualizar o favorito."]); }
    render();
  };
  $("#vdel").onclick = function () {
    arm(this, async function () {
      var it = byId(openId); if (!it) return;
      var idx = -1; for (var i = 0; i < flat.length; i++) if (flat[i].id === it.id) { idx = i; break; }
      var nb = flat[idx + 1] || flat[idx - 1];
      if (nb && nb.id !== it.id) openId = nb.id; else closeViewer();
      await deleteItems([it.id]); render();
    });
  };
  document.addEventListener("keydown", function (e) {
    if (e.target && /input|textarea/i.test(e.target.tagName)) return;
    if (!$("#viewer").hidden) {
      if (e.key === "Escape") closeViewer();
      else if (e.key === "ArrowLeft") step(-1);
      else if (e.key === "ArrowRight") step(1);
    } else if (e.key === "Escape" && selected.size) { selected.clear(); render(); }
  });

  /* ---------- filtros e busca ---------- */
  $("#chips").addEventListener("click", function (e) {
    var b = e.target.closest(".chip"); if (!b) return;
    filter = b.getAttribute("data-f");
    Array.from(document.querySelectorAll(".chip")).forEach(function (c) { c.setAttribute("aria-pressed", String(c === b)); });
    render();
  });
  $("#q").addEventListener("input", function () { query = this.value; render(); });

  /* ---------- envio ---------- */
  function kindFor(f) {
    var t = TYPES[extOf(f.name)];
    if (t) return [f.type || t[0], t[1]];
    var m = f.type || "";
    if (m.indexOf("image/") === 0) return [m, "image"];
    if (m.indexOf("video/") === 0) return [m, "video"];
    return [m || "application/octet-stream", "file"];
  }
  async function uploadFiles(list) {
    var files = Array.from(list), ok = 0, errs = [], wrote = false;
    for (var i = 0; i < files.length; i++) {
      var f = files[i], k = kindFor(f);
      setStatus("Salvando " + (i + 1) + " de " + files.length + ": " + f.name);
      if (f.size === 0) { errs.push(f.name + ": arquivo vazio"); continue; }
      if (f.size > MAX_BYTES) { errs.push(f.name + ": passa de " + fmtBytes(MAX_BYTES)); continue; }
      var it = { id: newId(), name: f.name, kind: k[1], mime: k[0], size: f.size, takenAt: f.lastModified || Date.now(), addedAt: Date.now(), fav: false, blob: f };
      try { await saveRecord(it); items.push(it); ok++; wrote = true; }
      catch (e) { errs.push(f.name + ": " + (e && e.name === "QuotaExceededError" ? "o armazenamento do navegador está cheio" : "não foi possível salvar")); }
    }
    if (wrote && navigator.storage && navigator.storage.persist) { try { navigator.storage.persist(); } catch (e) {} }
    setStatus(ok ? ok + (ok === 1 ? " arquivo salvo." : " arquivos salvos.") : "", errs);
    if (ok && !errs.length) setTimeout(function () { if (!$("#statusClose")) setStatus(""); }, 2500);
    render(); refreshUsage();
  }
  $("#uploadBtn").onclick = function () { $("#file").click(); };
  $("#file").addEventListener("change", function () { var l = Array.from(this.files); this.value = ""; if (l.length) uploadFiles(l); });
  var dragDepth = 0;
  window.addEventListener("dragenter", function (e) { if (!e.dataTransfer || Array.from(e.dataTransfer.types || []).indexOf("Files") < 0) return; dragDepth++; $("#drop").hidden = false; });
  window.addEventListener("dragleave", function () { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) $("#drop").hidden = true; });
  window.addEventListener("dragover", function (e) { e.preventDefault(); });
  window.addEventListener("drop", function (e) {
    e.preventDefault(); dragDepth = 0; $("#drop").hidden = true;
    if (e.dataTransfer && e.dataTransfer.files.length) uploadFiles(e.dataTransfer.files);
  });
  document.addEventListener("paste", function (e) {
    if (e.target && /input|textarea/i.test(e.target.tagName)) return;
    var fs = e.clipboardData && e.clipboardData.files; if (fs && fs.length) { e.preventDefault(); uploadFiles(fs); }
  });

  /* ---------- espaço usado ---------- */
  async function refreshUsage() {
    var m = $("#meter");
    var used = items.reduce(function (n, it) { return n + (it.size || 0); }, 0);
    var html = "<div>" + fmtBytes(used) + " guardados neste navegador</div>";
    try {
      if (navigator.storage && navigator.storage.estimate) {
        var est = await navigator.storage.estimate();
        if (est.quota) { var pct = Math.min(100, Math.max(1, Math.round((est.usage || 0) / est.quota * 100))); html += "<div class='bar'><i style='width:" + pct + "%'></i></div><div>" + fmtBytes(est.usage || 0) + " de " + fmtBytes(est.quota) + " disponíveis para este site</div>"; }
      }
    } catch (e) {}
    m.innerHTML = html; m.hidden = items.length === 0;
  }

  /* ---------- início ---------- */
  async function start() {
    if (!window.indexedDB) { loaded = true; $("#subtitle").textContent = ""; $("#main").innerHTML = "<div class='empty'><h2>Armazenamento indisponível</h2><p>Este navegador não permite guardar arquivos. Tente fora da aba anônima.</p></div>"; return; }
    try {
      idb = await openDB();
      items = await tx("readonly", function (s) { return s.getAll(); }) || [];
    } catch (e) {
      loaded = true; $("#subtitle").textContent = "";
      $("#main").innerHTML = "<div class='empty'><h2>Não foi possível abrir a galeria</h2><p>O navegador bloqueou o armazenamento. Tente fora da aba anônima.</p></div>";
      return;
    }
    loaded = true; render(); refreshUsage();
  }
  start();
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  }
})();
</script>
</body>
</html>
